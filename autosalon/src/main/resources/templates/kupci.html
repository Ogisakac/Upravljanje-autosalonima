<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Kupci</title>
</head>
<body>

<h1>Kupci</h1>

<a href="/">Nazad na pocetnu</a>
<br><br>
<a href="/kupci/novi">Dodaj kupca</a>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Ime</th>
            <th>Prezime</th>
            <th>Telefon</th>
            <th>Email</th>
            <th>Akcije</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="kupac : ${kupci}">
            <td th:text="${kupac.id}"></td>
            <td th:text="${kupac.ime}"></td>
            <td th:text="${kupac.prezime}"></td>
            <td th:text="${kupac.telefon}"></td>
            <td th:text="${kupac.email}"></td>
            <td>
                <a th:href="@{/kupci/izmeni/{id}(id=${kupac.id})}">Izmeni</a>

                <form th:action="@{/kupci/obrisi/{id}(id=${kupac.id})}" method="post" style="display:inline;">
                    <button type="submit">Obrisi</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
