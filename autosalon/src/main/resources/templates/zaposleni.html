<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Zaposleni</title>
</head>
<body>

<h1>Zaposleni</h1>

<a href="/">Nazad na pocetnu</a>
<br><br>
<a href="/zaposleni/novi">Dodaj zaposlenog</a>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Ime</th>
            <th>Prezime</th>
            <th>Pozicija</th>
            <th>Telefon</th>
            <th>Email</th>
            <th>Salon</th>
            <th>Akcije</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="z : ${zaposleni}">
            <td th:text="${z.id}"></td>
            <td th:text="${z.ime}"></td>
            <td th:text="${z.prezime}"></td>
            <td th:text="${z.pozicija}"></td>
            <td th:text="${z.telefon}"></td>
            <td th:text="${z.email}"></td>
            <td th:text="${z.salon.naziv}"></td>
            <td>
                <a th:href="@{/zaposleni/izmeni/{id}(id=${z.id})}">Izmeni</a>

                <form th:action="@{/zaposleni/obrisi/{id}(id=${z.id})}" method="post" style="display:inline;">
                    <button type="submit">Obrisi</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
