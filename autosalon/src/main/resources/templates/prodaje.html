<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Prodaje</title>
</head>
<body>

<h1>Prodaje</h1>

<h2>Funkcionalnosti</h2>
<a href="/prodaje/ukupan-prihod">Ukupan prihod</a>
<form action="/prodaje/kupac" method="get">
    <p>ID kupca:
        <input type="number" name="kupacId" required>
        <button type="submit">Prikazi prodaje kupca</button>
    </p>
</form>
<form action="/prodaje/zaposleni" method="get">
    <p>ID zaposlenog:
        <input type="number" name="zaposleniId" required>
        <button type="submit">Prikazi prodaje zaposlenog</button>
    </p>
</form>

<br>

<a href="/">Nazad na pocetnu</a>
<br><br>
<a href="/prodaje/nova">Dodaj prodaju</a>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Datum prodaje</th>
            <th>Cena prodaje</th>
            <th>Način plaćanja</th>
            <th>Automobil</th>
            <th>Kupac</th>
            <th>Zaposleni</th>
            <th>Akcije</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="prodaja : ${prodaje}">
            <td th:text="${prodaja.id}"></td>
            <td th:text="${prodaja.datumProdaje}"></td>
            <td th:text="${prodaja.cenaProdaje}"></td>
            <td th:text="${prodaja.nacinPlacanja}"></td>
            <td th:text="${prodaja.automobil.marka + ' ' + prodaja.automobil.model}"></td>
            <td th:text="${prodaja.kupac.ime + ' ' + prodaja.kupac.prezime}"></td>
            <td th:text="${prodaja.zaposleni.ime + ' ' + prodaja.zaposleni.prezime}"></td>
            <td>
                <form th:action="@{/prodaje/obrisi/{id}(id=${prodaja.id})}" method="post" style="display:inline;">
                    <button type="submit">Obriši</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
